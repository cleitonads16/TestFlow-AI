# API + MySQL 8.4. A partir da raiz do projeto:
#   docker compose -f docker/docker-compose.yml up -d --build
# Testes automatizados contra o MySQL do compose:
#   docker compose -f docker/docker-compose.yml --profile testes run --rm testes
# As variáveis vêm de docker/.env (modelo em docker/.env.exemplo).

name: casos-teste

x-ambiente-api: &ambiente-api
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY em docker/.env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  MYSQL_HOST: mysql
  MYSQL_DATABASE: casos_teste
  MYSQL_USER: casos_teste
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD em docker/.env}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: casos_teste
      MYSQL_USER: casos_teste
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD em docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD em docker/.env}
    volumes:
      - dados-mysql:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    # A API só sobe quando o MySQL aceita conexões do usuário da aplicação;
    # "porta aberta" não basta, porque na primeira subida o MySQL ainda está
    # criando o banco e o usuário.
    healthcheck:
      test: ["CMD-SHELL", "mysql -ucasos_teste -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' casos_teste"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: casos-teste-api
    environment:
      <<: *ambiente-api
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    # As chaves da IA entram como secrets (arquivos em /run/secrets/), e não
    # como variáveis de ambiente: não aparecem em `docker inspect`, não vão
    # para a imagem e não chegam ao container de testes.
    secrets:
      - anthropic_api_key
      - openai_api_key
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  testes:
    image: casos-teste-api
    profiles: ["testes"]
    environment: *ambiente-api
    volumes:
      - ../testes:/app/testes:ro
      - ../pyproject.toml:/app/pyproject.toml:ro
    entrypoint: []
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  dados-mysql:
  uploads:

# Caminho de cada arquivo de chave, FORA do repositório (docker/.env). Sem ele,
# usa um arquivo vazio: a API sobe e só a geração via IA responde 503.
secrets:
  anthropic_api_key:
    file: ${ANTHROPIC_API_KEY_ARQUIVO:-./sem-chave-ia}
  openai_api_key:
    file: ${OPENAI_API_KEY_ARQUIVO:-./sem-chave-ia}
